<!DOCTYPE html>
<html>
    <link id="theme-style" rel="stylesheet" href="styles/white-theme.css" />
    <link rel="stylesheet" href="icons/mynaui.css" />
    <title>Control panel</title>
    <body>
        <div class="left-panel liquid-glass">
            <label class="panel-label">Control panel</label>
            <a href="#home" class="mynaui-home panel-button  liquid-glass-button">Home</a>
            <a href="#dashboard" class="mynaui-code panel-button liquid-glass-button">Dashboard</a>
            <a href="#settings" class="mynaui-config panel-button  liquid-glass-button">Settings</a>
            <a href="#help" class="mynaui-book panel-button liquid-glass-button ">Help</a>
            <button id="logoutBt" class="mynaui-logout panel-button liquid-glass-button ">Logout</button>
            <button id="theme-toggle-button" class="theme-change-bt">🌙</button>
        </div>
        <div class="main-content">
            <!-- Home page -->
            <div id="home" class="content-section active"">
                <div class="block">
                    <label class="liquid-glass-label" style="text-align: center;">License</label>
                    <label class="liquid-glass-label">Current key:</label>
                    <button id="currentKey" class="liquid-glass-button">0000-0000-0000-0000</button>
                </div>
                <div class="block">
                    <label class="liquid-glass-label" style="text-align: center;">Profile</label>
                    <label id="currentEmail" class="liquid-glass-label">Email: </label>
                    <button id="currentId" class="liquid-glass-button">ID: 0b0-0a0</button>
                </div>
                <div class="block">
                </div>
                <div class="block-1">
                </div>
                <div class="block-1">
                    <label class="liquid-glass-label" style="text-align: center; margin-left: 18%;">Energy: 100⚡</label>
                    <label class="liquid-glass-label" style="text-align: center; margin-left: 18%;">Rebith: 0</label>
                    <label class="liquid-glass-label" style="text-align: center; margin-left: 18%;">Current coins: </label>
                    <label class="liquid-glass-label"  style="text-align: center; margin-left: 18%;">999$</label>
                </div>
                <div class="block-1">
                </div>
            </div>
            <!-- Dashboard page -->
            <div id="dashboard" class="content-section active">
                <div class="block">
                    <label class="liquid-glass-label">Dashboard</label>
                    <button class="liquid-glass-button">Set</button>
                    <button class="liquid-glass-button">Reset</button>
                </div>
                <div class="block">
                </div>
                <div class="block">
                </div>
                <div class="block-1">
                </div>
                <div class="block-1">
                </div>
                <div class="block-1">
                </div>
            </div>
            <!-- Settings page -->
             <div id="settings" class="content-section active">
                <div class="block-1" style="padding-left: 10px;
    padding-top: 10px;
    padding-bottom: 10px;
    display: flex;
    align-items: center;
    flex-direction: column; flex-wrap: wrap;">
                    <label class="liquid-glass-label" style="text-align: center;">Language:</label>
                    <label class="liquid-glass-label" style="text-align: center;">ru-RU</label>
                    <button class="liquid-glass-button" style="width: 280px;
  height: 50px;">Change language</button>
                    <button class="liquid-glass-button" style="width: 280px;
  height: 50px;">Switch account</button>
                    <button class="liquid-glass-button" style="width: 280px;
  height: 50px; background-color: rgba(255, 0, 0, 0.25);">Delete account</button>
                </div>
                <div class="block-1" style="padding-left: 10px;
    padding-top: 10px;
    padding-bottom: 10px;
    display: flex;
    align-items: center;
    flex-direction: column; flex-wrap: wrap;">
                    <label class="liquid-glass-label" style="text-align: center;">Credits</label>
                    <label class="liquid-glass-label" style="text-align: center; background-color: rgba(74, 205, 205, 0.25);">Founder: @Jere2009</label>
                    <label class="liquid-glass-label" style="text-align: center; background-color: rgb(211, 211, 131, 0.25);">Frontend: @Jere2009</label>
                    <label class="liquid-glass-label" style="text-align: center; background-color: rgba(0, 255, 4, 0.25);">Backend: @Jere2009</label>
                </div>
            </div>
            <!-- Help page -->
        <div style="padding: 50px;">
            <label class="liquid-glass-label" style="width: 145px;">Made by Jere2009</label>
        </div>
        </div>
    </body>
    <script src="scripts/script.js"></script>
</html>
